name: Windows release

# Builds the Windows desktop app and installer on GitHub's Windows machines and publishes it as a
# numbered release (v1.15.<run>), which the app's updater picks up. Add [skip build] to a commit
# message to skip it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip build]')"
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      # short cargo target dir: vendored OpenSSL's perl Configure fails past MAX_PATH
      CARGOKIT_TEMP_DIR_OVERRIDE: C:\obk
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: version
        shell: bash
        run: |
          base=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+)\.([0-9]+).*/\1.\2/')
          version="$base.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-directories: C:\obk
          shared-key: windows-release

      - name: Install build tools
        shell: pwsh
        run: |
          choco install -y --no-progress protoc nasm innosetup
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Strawberry\perl\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "PROTOC=C:\ProgramData\chocolatey\bin\protoc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Set up placeholder Fairplay certs
        shell: bash
        run: |
          mkdir -p rustpush/certs/fairplay
          for name in 4056631661436364584235346952193 4056631661436364584235346952194 4056631661436364584235346952195 \
                      4056631661436364584235346952196 4056631661436364584235346952197 4056631661436364584235346952198 \
                      4056631661436364584235346952199 4056631661436364584235346952200 4056631661436364584235346952201 \
                      4056631661436364584235346952208; do
            cp rustpush/certs/legacy-fairplay/fairplay.pem rustpush/certs/fairplay/$name.pem
            cp rustpush/certs/legacy-fairplay/fairplay.crt rustpush/certs/fairplay/$name.crt
          done

      - name: Build app
        shell: bash
        run: |
          flutter pub get
          flutter build windows --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build }}

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q /DMyAppVersion=${{ steps.version.outputs.version }} windows\openbubbles_installer.iss
          Get-ChildItem build\installer

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenBubbles Desktop ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: "true"
          files: build/installer/OpenBubbles-Desktop-Setup-${{ steps.version.outputs.version }}.exe
          body: |
            Windows installer for this build. Install it, or let the app update itself (it checks for new releases and asks first).
            The installer isn't code-signed, so SmartScreen may warn you: **More info → Run anyway**.
