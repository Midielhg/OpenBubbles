<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; width: 280px; font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .wrap { padding: 14px 16px; }
  .title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
  .title img { width: 22px; height: 22px; border-radius: 5px; }
  .status { display: flex; gap: 8px; align-items: flex-start; }
  .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; background: #8e8e93; }
  .ok .dot { background: #34c759; }
  .bad .dot { background: #ff9f0a; }
  .hint { margin-top: 8px; color: #6e6e73; }
  .small { margin-top: 10px; font-size: 11px; color: #8e8e93; }
  .open { margin-top: 12px; width: 100%; border: 0; border-radius: 8px; padding: 8px; font: inherit; font-weight: 600;
    background: #0a84ff; color: #fff; cursor: pointer; }
  .open:hover { background: #0071e3; }
  @media (prefers-color-scheme: dark) { .hint { color: #a1a1a6; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="title"><img src="icons/icon32.png" alt="">Passwords</div>
  <div id="status" class="status"><div class="dot"></div><div id="text">Checking…</div></div>
  <div id="hint" class="hint"></div>
  <div id="passkey" class="hint" hidden></div>
  <button id="open" class="open">Open Passwords</button>
  <div id="versions" class="small"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
