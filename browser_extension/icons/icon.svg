    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64D2FF"/><stop offset="1" stop-color="#0A6CFF"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BE07F"/><stop offset="1" stop-color="#28B14C"/></linearGradient>
